<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پازل عبارت‌های جبری - کلاس هشتم</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    padding: 15px; overflow-x: hidden;
  }
  .app {
    width: 100%; max-width: 800px; background: rgba(255,255,255,0.95);
    border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 25px; position: relative; overflow: hidden;
    animation: fadeIn 0.6s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px);} to {opacity:1; transform: translateY(0);} }
  
  .page { display: none; animation: slideIn 0.5s ease; }
  .page.active { display: block; }
  @keyframes slideIn { from {opacity:0; transform: translateX(30px);} to {opacity:1; transform: translateX(0);} }

  h1, h2 { text-align: center; color: #4a148c; margin-bottom: 15px; }
  h1 { font-size: 1.8rem; } h2 { font-size: 1.4rem; }

  .welcome-box { text-align: center; padding: 10px; }
  .teacher-name {
    font-size: 1.1rem; color: #7b1fa2; background: #f3e5f5;
    display: inline-block; padding: 8px 20px; border-radius: 20px;
    margin-bottom: 20px; font-weight: bold;
  }
  input[type="text"] {
    width: 100%; max-width: 300px; padding: 12px 18px; font-family: inherit;
    font-size: 1rem; border: 2px solid #ce93d8; border-radius: 15px;
    outline: none; text-align: center; transition: 0.3s; margin: 10px auto; display: block;
  }
  input[type="text"]:focus { border-color: #8e24aa; box-shadow: 0 0 12px rgba(142,36,170,0.3); }

  .btn {
    background: linear-gradient(135deg, #ab47bc, #7b1fa2); color: white;
    border: none; padding: 12px 30px; border-radius: 25px; font-family: inherit;
    font-size: 1.05rem; cursor: pointer; transition: 0.3s; margin: 8px 5px;
    font-weight: bold; box-shadow: 0 5px 15px rgba(123,31,162,0.35);
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(123,31,162,0.5); }
  .btn:active { transform: translateY(0); }
  .btn.secondary { background: linear-gradient(135deg, #4fc3f7, #0288d1); }
  .btn.success { background: linear-gradient(135deg, #66bb6a, #2e7d32); }
  .btn.warning { background: linear-gradient(135deg, #ffa726, #ef6c00); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

  /* تصویرسازی میز مطالعه */
  .illustration-container { display: flex; justify-content: center; align-items: center; margin: 10px 0 25px; }
  .illustration-svg { width: 100%; max-width: 500px; height: auto; border-radius: 20px; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15)); animation: float 4s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  /* بازی */
  .game-header { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(90deg, #e1bee7, #b2ebf2); padding: 10px 20px; border-radius: 15px; margin-bottom: 20px; font-weight: bold; color: #4a148c; }
  .score, .progress { background: #fff; padding: 5px 15px; border-radius: 20px; }

  .question-box { background: linear-gradient(135deg, #fff8e1, #ffe0b2); border: 3px dashed #ff9800; border-radius: 20px; padding: 25px 20px; text-align: center; margin-bottom: 20px; min-height: 160px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .question-text { font-size: 1.2rem; color: #e65100; margin-bottom: 12px; font-weight: bold; }
  .expression { font-size: 1.6rem; color: #4a148c; font-weight: bold; background: #fff; padding: 15px 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); letter-spacing: 1px; line-height: 1.8; word-wrap: break-word; }

  .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px; }
  .puzzle-tile { position: relative; aspect-ratio: 1 / 1; border-radius: 18px; border: none; cursor: pointer; font-family: inherit; font-size: 1.3rem; font-weight: bold; color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; transition: 0.25s ease; box-shadow: 0 6px 0 rgba(0,0,0,0.2), 0 8px 18px rgba(0,0,0,0.2); overflow: hidden; text-shadow: 0 2px 4px rgba(0,0,0,0.35); }
  .puzzle-tile::before, .puzzle-tile::after { content: ''; position: absolute; background: inherit; border-radius: 50%; width: 26%; height: 26%; box-shadow: inset 0 0 0 4px rgba(255,255,255,0.35); }
  .puzzle-tile::before { top: -13%; left: 50%; transform: translateX(-50%); }
  .puzzle-tile::after { bottom: -13%; left: 50%; transform: translateX(-50%); }
  .tile-c0 { background: linear-gradient(135deg, #ff8a65, #f4511e); }
  .tile-c1 { background: linear-gradient(135deg, #4fc3f7, #0288d1); }
  .tile-c2 { background: linear-gradient(135deg, #81c784, #388e3c); }
  .tile-c3 { background: linear-gradient(135deg, #ba68c8, #7b1fa2); }
  .puzzle-tile:hover:not(:disabled) { transform: translateY(-5px) scale(1.03); box-shadow: 0 10px 0 rgba(0,0,0,0.2), 0 14px 25px rgba(0,0,0,0.3); }
  .puzzle-tile.correct { background: linear-gradient(135deg, #66bb6a, #2e7d32) !important; animation: pop 0.4s ease; }
  .puzzle-tile.wrong { background: linear-gradient(135deg, #ef5350, #b71c1c) !important; animation: shake 0.4s; }
  @keyframes pop { 0%{transform:scale(1);} 50%{transform:scale(1.12);} 100%{transform:scale(1);} }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  .feedback { text-align: center; font-size: 1.1rem; font-weight: bold; min-height: 40px; margin-bottom: 15px; padding: 8px; border-radius: 12px; opacity: 0; transition: 0.4s; }
  .feedback.show { opacity: 1; }
  .feedback.good { color: #2e7d32; background: #e8f5e9; }
  .feedback.bad { color: #c62828; background: #ffebee; }

  .nav-bar { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 15px; padding-top: 15px; border-top: 2px solid #f3e5f5; }
  .nav-bar .btn { flex: 1; min-width: 100px; font-size: 0.95rem; padding: 10px; }

  .end-box { text-align: center; padding: 20px; }
  .trophy { font-size: 4rem; animation: float 1.5s infinite; }
  .final-score { font-size: 1.5rem; color: #e65100; margin: 15px 0; font-weight: bold; }

  @media (max-width: 500px) {
    h1 { font-size: 1.4rem; } .puzzle-tile { font-size: 1.1rem; } .expression { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- صفحه ۱: خوش آمدگویی -->
  <div class="page active" id="page-welcome">
    <h1>🎓 پازل عبارت‌های جبری</h1>
    <h2>ریاضی پایه هشتم</h2>
    
    <div class="illustration-container">
      <svg class="illustration-svg" viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="tt" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FFE0B2"/><stop offset="100%" stop-color="#FFB74D"/></linearGradient>
          <linearGradient id="tf" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#F57C00"/><stop offset="100%" stop-color="#E65100"/></linearGradient>
          <linearGradient id="bc" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#29B6F6"/><stop offset="100%" stop-color="#0277BD"/></linearGradient>
          <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.2"/></filter>
        </defs>
        <rect width="500" height="350" fill="#F3E5F5" rx="20" />
        <g transform="translate(140, 30)">
          <rect width="220" height="130" rx="8" fill="#5D4037" filter="url(#sh)"/>
          <rect x="10" y="10" width="200" height="110" rx="4" fill="#1B5E20"/>
          <text x="110" y="55" font-family="Vazirmatn" font-size="24" font-weight="bold" fill="#FFF" text-anchor="middle">ریاضی</text>
          <text x="110" y="90" font-family="Vazirmatn" font-size="20" font-weight="bold" fill="#FFEB3B" text-anchor="middle">هشتم</text>
        </g>
        <path d="M 20 300 L 480 300 L 470 350 L 30 350 Z" fill="url(#tf)"/>
        <rect x="10" y="260" width="480" height="40" rx="10" fill="url(#tt)" filter="url(#sh)"/>
        <g transform="translate(110, 170) rotate(-5)">
          <rect x="0" y="40" width="180" height="30" rx="3" fill="#ECEFF1"/>
          <path d="M 90 40 L 180 40 L 180 80 L 90 80 Z" fill="#FFF"/>
          <path d="M 0 40 L 90 40 L 90 80 L 0 80 Z" fill="#FAFAFA"/>
          <path d="M 0 40 L 0 75 L 90 75 L 90 40 Z" fill="url(#bc)"/>
          <path d="M 180 40 L 180 75 L 90 75 L 90 40 Z" fill="url(#bc)"/>
          <rect x="25" y="45" width="40" height="12" rx="3" fill="#FFEB3B"/>
          <text x="45" y="55" font-family="Vazirmatn" font-size="9" font-weight="bold" fill="#E65100" text-anchor="middle">هشتم</text>
          <circle cx="135" cy="58" r="12" fill="#FFF" opacity="0.3"/>
        </g>
        <g transform="translate(300, 200)">
          <rect x="0" y="20" width="50" height="55" rx="5" fill="#1976D2" filter="url(#sh)"/>
          <ellipse cx="25" cy="20" rx="25" ry="8" fill="#64B5F6"/>
          <g transform="translate(10, -30) rotate(10)"><rect width="8" height="50" fill="#F44336"/><polygon points="0,0 4,-10 8,0" fill="#FFCC80"/></g>
          <g transform="translate(22, -35) rotate(-5)"><rect width="8" height="55" fill="#4CAF50"/><polygon points="0,0 4,-10 8,0" fill="#FFCC80"/></g>
          <g transform="translate(34, -25) rotate(15)"><rect width="8" height="45" fill="#2196F3"/><polygon points="0,0 4,-10 8,0" fill="#FFCC80"/></g>
        </g>
      </svg>
    </div>

    <div class="welcome-box">
      <div class="teacher-name">👩‍🏫 نام دبیر: خانم بزرگی</div>
      <p style="margin-bottom:12px; color:#555;">لطفاً نام خود را وارد کنید:</p>
      <input type="text" id="studentName" placeholder="نام و نام خانوادگی شما..." maxlength="30">
      <!-- دکمه شروع -->
      <button class="btn" id="btnStart">شروع بازی 🚀</button>
    </div>
  </div>

  <!-- صفحه ۲: بازی -->
  <div class="page" id="page-game">
    <div class="game-header">
      <span class="progress" id="progress">سؤال ۱ از ۶</span>
      <span class="score" id="score">🌟 امتیاز: ۰</span>
    </div>
    <div class="question-box">
      <div class="question-text">حاصل عبارت را به دست آورید:</div>
      <div class="expression" id="expression">2x + 5x</div>
    </div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav-bar">
      <button class="btn secondary" id="btnHome">🏠 صفحه اصلی</button>
      <button class="btn warning" id="btnPrev">⬅️ قبل</button>
      <button class="btn success" id="btnNext">بعد ➡️</button>
    </div>
  </div>

  <!-- صفحه ۳: پایان -->
  <div class="page" id="page-end">
    <div class="end-box">
      <div class="trophy">🏆</div>
      <h1>آفرین! تمام شد 🎉</h1>
      <p class="final-score" id="finalScore">امتیاز شما: ۰ از ۶</p>
      <p id="endMessage" style="color:#6a1b9a; font-weight:bold; margin-bottom:20px;"></p>
      <button class="btn" id="btnRestart">🔄 بازی مجدد</button>
      <button class="btn secondary" id="btnGoHome">🏠 صفحه اصلی</button>
    </div>
  </div>

</div>

<script>
  // ۱. دیتای سوالات
  const questions = [
    { expr: "۲x(۳x − ۵) + ۴x²", answer: "۱۰x² − ۱۰x", options: ["۱۰x² − ۱۰x", "۶x² − ۱۰x + ۴x²", "۱۰x² + ۱۰x", "۲x² − ۵"] },
    { expr: "۳ab + b² − a² − ۲ab", answer: "ab + b² − a²", options: ["ab + b² − a²", "۵ab − a²", "ab − b² + a²", "۳ab − a²"] },
    { expr: "(x − ۳)(x + ۲)", answer: "x² − x − ۶", options: ["x² − x − ۶", "x² + x − ۶", "x² − ۵x − ۶", "x² − ۶"] },
    { expr: "(a + ۵)(a − ۵)", answer: "a² − ۲۵", options: ["a² − ۲۵", "a² + ۲۵", "a² − ۱۰a + ۲۵", "a² − ۱۰"] },
    { expr: "۲a(−۵x) + ۳a(۴x)", answer: "۲ax", options: ["۲ax", "−۲ax", "۲۲ax", "−۲۲ax"] },
    { expr: "(۲x − ۳)²", answer: "۴x² − ۱۲x + ۹", options: ["۴x² − ۱۲x + ۹", "۴x² + ۹", "۴x² − ۶x + ۹", "۲x² − ۱۲x + ۹"] }
  ];

  let currentIndex = 0;
  let score = 0;
  let answered = [];

  // ۲. سیستم صدا (Web Audio API)
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new AudioCtx();
    return audioCtx;
  }
  function playBuzz() {
    try {
      const ctx = getAudioCtx(); const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = "sawtooth"; osc.frequency.setValueAtTime(180, ctx.currentTime);
      osc.frequency.setValueAtTime(120, ctx.currentTime + 0.15); osc.frequency.setValueAtTime(180, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.15, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.5);
    } catch(e) {}
  }
  function playSuccess() {
    try {
      const ctx = getAudioCtx(); const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = "sine"; osc.frequency.value = freq;
        const start = ctx.currentTime + i * 0.12;
        gain.gain.setValueAtTime(0.001, start); gain.gain.exponentialRampToValueAtTime(0.2, start + 0.03); gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
        osc.connect(gain); gain.connect(ctx.destination); osc.start(start); osc.stop(start + 0.3);
      });
    } catch(e) {}
  }

  // ۳. توابع کمکی
  function toPersian(n) { return String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]); }
  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ۴. منطق بازی
  const btnStart = document.getElementById('btnStart');
  const btnHome = document.getElementById('btnHome');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const btnRestart = document.getElementById('btnRestart');
  const btnGoHome = document.getElementById('btnGoHome');

  btnStart.addEventListener('click', () => {
    const nameInput = document.getElementById('studentName').value.trim();
    if (!nameInput) { alert("لطفاً نام خود را وارد کنید."); return; }
    currentIndex = 0; score = 0; answered = new Array(questions.length).fill(null);
    getAudioCtx();
    showPage('page-game');
    renderQuestion();
  });

  btnHome.addEventListener('click', () => showPage('page-welcome'));
  btnGoHome.addEventListener('click', () => showPage('page-welcome'));
  btnRestart.addEventListener('click', () => {
    currentIndex = 0; score = 0; answered = new Array(questions.length).fill(null);
    showPage('page-game'); renderQuestion();
  });
  btnPrev.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(); } });
  btnNext.addEventListener('click', () => {
    if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); }
    else endGame();
  });

  function renderQuestion() {
    const q = questions[currentIndex];
    document.getElementById('progress').textContent = `سؤال ${toPersian(currentIndex+1)} از ${toPersian(questions.length)}`;
    document.getElementById('score').textContent = `🌟 امتیاز: ${toPersian(score)}`;
    document.getElementById('expression').textContent = q.expr.replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);

    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';
    const shuffled = [...q.options].sort(() => Math.random() - 0.5);
    shuffled.forEach((opt, i) => {
      const tile = document.createElement('button');
      tile.className = `puzzle-tile tile-c${i % 4}`;
      tile.textContent = opt;
      tile.onclick = () => checkAnswer(tile, opt);
      optionsDiv.appendChild(tile);
    });

    const fb = document.getElementById('feedback');
    fb.className = 'feedback'; fb.textContent = '';

    btnPrev.disabled = currentIndex === 0;
    btnNext.textContent = currentIndex === questions.length - 1 ? "پایان 🎉" : "بعد ➡️";

    if (answered[currentIndex] !== null) applyAnsweredState();
  }

  function checkAnswer(tile, opt) {
    const q = questions[currentIndex];
    if (answered[currentIndex] === true) return;

    if (opt === q.answer) {
      if (answered[currentIndex] !== true) { score++; answered[currentIndex] = true; }
      tile.classList.add('correct');
      document.querySelectorAll('.puzzle-tile').forEach(t => {
        t.disabled = true;
        if (t.textContent === q.answer) t.classList.add('correct');
      });
      playSuccess();
      showFeedback(true);
      document.getElementById('score').textContent = `🌟 امتیاز: ${toPersian(score)}`;
    } else {
      answered[currentIndex] = false;
      tile.classList.add('wrong');
      tile.disabled = true;
      playBuzz();
      showFeedback(false);
    }
  }

  function showFeedback(good) {
    const fb = document.getElementById('feedback');
    if (good) {
      const msgs = ["عالی بود! ادامه بده 🌟", "آفرین! تو یک ریاضیدان واقعی هستی 💪", "درست جواب دادی! همین‌طور پیش برو 🚀", "باریکلا! ذهنت مثل الماس می‌درخشه ✨", "صحیح بود! به خودت افتخار کن 🏅"];
      fb.textContent = msgs[Math.floor(Math.random() * msgs.length)];
      fb.className = 'feedback show good';
    } else {
      const msgs = ["بوق! دوباره امتحان کن 🔔", "اشتباه بود، یه بار دیگه فکر کن 🤔", "نگران نباش، دوباره تلاش کن 💡", "نه این یکی! با دقت بیشتری حساب کن 📝"];
      fb.textContent = msgs[Math.floor(Math.random() * msgs.length)];
      fb.className = 'feedback show bad';
    }
  }

  function applyAnsweredState() {
    const q = questions[currentIndex];
    document.querySelectorAll('.puzzle-tile').forEach(t => {
      if (t.textContent === q.answer) t.classList.add('correct');
      t.disabled = true;
    });
    if (answered[currentIndex] === true) {
      const fb = document.getElementById('feedback');
      fb.textContent = "پاسخ صحیح ثبت شده است ✅";
      fb.className = 'feedback show good';
    }
  }

  function endGame() {
    document.getElementById('finalScore').textContent = `امتیاز شما: ${toPersian(score)} از ${toPersian(questions.length)}`;
    const msgEl = document.getElementById('endMessage');
    if (score === questions.length) msgEl.textContent = "کامل و بی‌نقص! تو نابغه ریاضی هستی 🏆";
    else if (score >= questions.length / 2) msgEl.textContent = "خیلی خوب بود! با کمی تمرین بیشتر عالی می‌شی 💪";
    else msgEl.textContent = "اشکالی نداره! دوباره تلاش کن، تو می‌تونی 🌱";
    showPage('page-end');
  }
</script>
</body>
</html>
